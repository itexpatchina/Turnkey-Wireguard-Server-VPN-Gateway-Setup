name: Trigger Blog Sync

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'README.md'

jobs:
  notify-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch event to itexpatchina-blog
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.BLOG_SYNC_TOKEN }}" \
            https://api.github.com/repos/itexpatchina/itexpatchina-blog/dispatches \
            -d '{"event_type":"repo_updated"}'
